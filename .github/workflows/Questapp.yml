name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web-Dateien vorbereiten
        run: |
          mkdir -p www
          cp index.html app.js config.js manifest.webmanifest sw.js icon.svg www/

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: App-Icon einsetzen
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/launcher-$d.png   $RES/mipmap-$d/ic_launcher.png
            cp icons/round-$d.png      $RES/mipmap-$d/ic_launcher_round.png
            cp icons/foreground-$d.png $RES/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FF6A00</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Quests-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
